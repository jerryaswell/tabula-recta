name: Deploy

# Only when dispatched. Several commits can land on main and one run then
# tests and publishes them together; nothing runs on a push (CLAUDE.md,
# "GitHub Actions: on dispatch only"). Dispatched on another branch, it tests
# and builds that branch and publishes nothing.
on:
  workflow_dispatch:

# nothing at workflow level; each job asks for what it uses, so the job that
# runs npm and the test suite never holds the token that publishes
permissions: {}

# one deploy at a time, and never cancel one half way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    # this job runs the browser tests as well as the build
    timeout-minutes: 20
    permissions:
      contents: read
      # configure-pages reads the repository's Pages settings
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    # main only: a dispatch can name any branch, and only main is the site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
